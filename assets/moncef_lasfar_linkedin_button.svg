<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">LinkedIn profile — Moncef Lasfar</title>
<desc id="desc">A rounded dark navy LinkedIn profile button with electric blue curves and an external link icon.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1b30"/><stop offset=".55" stop-color="#061326"/><stop offset="1" stop-color="#030b17"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#36dcff"/><stop offset=".5" stop-color="#168cff"/><stop offset="1" stop-color="#145bd6"/>
  </linearGradient>
  <linearGradient id="linkedin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#168eea"/><stop offset="1" stop-color="#0755b8"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect x="12" y="12" width="1176" height="256" rx="42"/></clipPath>
</defs>
<rect x="12" y="12" width="1176" height="256" rx="42" fill="url(#bg)" stroke="url(#blue)" stroke-width="3"/>
<g clip-path="url(#clip)" fill="none">
  <path d="M560 280 C720 225 830 258 940 180 S1090 105 1220 45" stroke="#0c62b2" stroke-width="42" opacity=".12"/>
  <path d="M570 278 C735 218 835 258 950 177 S1090 108 1210 48" stroke="#168cff" stroke-width="1.8" opacity=".42"/>
  <path d="M650 278 C795 230 875 268 980 203 S1100 142 1210 92" stroke="#36d8ff" stroke-width="1.3" opacity=".25"/>
  <path d="M940 18 C1000 55 1080 25 1180 5" stroke="#168cff" stroke-width="1.2" opacity=".2"/>
</g>
<!-- LinkedIn mark -->
<rect x="74" y="73" width="132" height="134" rx="25" fill="url(#linkedin)" stroke="#27caff" stroke-width="3" filter="url(#glow)"/>
<g fill="#fff">
  <circle cx="111" cy="111" r="9"/>
  <path d="M101 130h20v57h-20z"/>
  <path d="M134 130h19v8c5-7 12-10 21-10 18 0 25 12 25 31v28h-20v-25c0-10-2-17-12-17-11 0-13 8-13 17v25h-20z"/>
</g>
<path d="M246 61V219" stroke="#259fff" stroke-width="2" opacity=".9"/>
<text x="292" y="111" fill="#32bdff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="2.6">LINKEDIN PROFILE</text>
<text x="292" y="171" fill="#f7f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="49" font-weight="750" letter-spacing=".5">MONCEF LASFAR</text>
<path d="M292 198H560" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" opacity=".85"/>
<!-- external link -->
<g transform="translate(1050 91)" fill="none" stroke="url(#blue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M42 8h37v37"/><path d="M79 8 36 51"/>
  <path d="M72 55v29a9 9 0 0 1-9 9H12a9 9 0 0 1-9-9V31a9 9 0 0 1 9-9h28"/>
</g>
</svg>