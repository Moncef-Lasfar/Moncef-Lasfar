    C PROJECT · VIEW REPOSITORY
  </text>

  <!-- Right Arrow -->
  <path d="M390 29h14m-6-6 6 6-6 6" fill="none" stroke="#28aaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

</svg>

