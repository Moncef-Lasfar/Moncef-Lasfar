<svg xmlns="http://www.w3.org/2000/svg"
     width="472"
     height="58"
     viewBox="0 0 472 58"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Patient Management System</title>

  <defs>
   <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111d30"/>
    <stop offset="1" stop-color="#0b1525"/>
   </linearGradient>
  </defs>

  <!-- Background -->
 <rect x="1" y="1" width="428" height="57" rx="10" fill="url(#panel)" stroke="#24547d" stroke-width="1.2"/>

  <!-- Project Folder Icon -->
 <path
  d="M17 16
     a4 4 0 0 1 4-4
     h13 l5 5 h13
     a4 4 0 0 1 4 4
     v16
     a4 4 0 0 1-4 4
     H21
     a4 4 0 0 1-4-4z"
  transform="translate(-10 -5) scale(1.25)"
  fill="none"
  stroke="#39A7FF"
  stroke-width="2"
/>

  <!-- Code Icon -->
  <path
    d="m30 22-5 5 5 5
       m10-10 5 5-5 5
       m-3-12-4 14"
       transform="translate(-10 -3) scale(1.25)"
    fill="none"
    stroke="#EAF2FF"
    stroke-width="1.8"
  />

  <!-- Divider -->
<path d="M60 9v40" stroke="#2877ad" stroke-width="1"/>

  <!-- Project Title -->
  <text
    x="82" y="24"
    fill="#EAF2FF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
