<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Patient Management System</title>
  <desc id="d">Featured project: a menu-driven C application for managing patient records with create, view, update, delete, search, sort, filter and local file storage. View repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C2B"/>
      <stop offset="1" stop-color="#0b1320"/>
    </linearGradient>
    <radialGradient id="glow" cx="750" cy="200" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39A7FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#39A7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#168fe8"/>
      <stop offset="1" stop-color="#0755b8"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="958" height="378" rx="18" fill="url(#bg)" stroke="#24547d" stroke-width="1.5"/>
  <rect x="1" y="1" width="958" height="378" rx="18" fill="url(#glow)"/>

  <!-- label -->
  <rect x="40" y="49" width="4" height="15" rx="2" fill="#39A7FF"/>
  <text x="54" y="62" class="sans" font-size="12" font-weight="700" letter-spacing="2.4" fill="#39A7FF">FEATURED PROJECT</text>

  <!-- title + description -->
  <text x="40" y="108" class="sans" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#EAF2FF">Patient Management System</text>
  <text x="40" y="138" class="sans" font-size="16" fill="#91A4BD">A menu-driven C application for managing patient records.</text>

  <!-- tech tags -->
  <g class="sans" font-size="12" font-weight="600" fill="#C9D6E8" text-anchor="middle">
    <rect x="40"  y="156" width="34"  height="26" rx="13" fill="#0d1624" stroke="#659AD2" stroke-opacity="0.7"/>
    <text x="57"  y="173">C</text>
    <rect x="82"  y="156" width="166" height="26" rx="13" fill="#0d1624" stroke="#26364B"/>
    <text x="165" y="173">Structured programming</text>
    <rect x="256" y="156" width="108" height="26" rx="13" fill="#0d1624" stroke="#26364B"/>
    <text x="310" y="173">File handling</text>
  </g>

  <!-- features -->
  <g class="sans" font-size="16" fill="#C9D6E8">
    <g fill="#0f2a4a" stroke="#39A7FF" stroke-width="1.2">
      <circle cx="48" cy="219" r="8"/><circle cx="48" cy="245" r="8"/><circle cx="48" cy="271" r="8"/><circle cx="48" cy="297" r="8"/>
    </g>
    <g fill="none" stroke="#39A7FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44.5 219 l2.5 2.5 l4.5 -5"/><path d="M44.5 245 l2.5 2.5 l4.5 -5"/>
      <path d="M44.5 271 l2.5 2.5 l4.5 -5"/><path d="M44.5 297 l2.5 2.5 l4.5 -5"/>
    </g>
    <text x="66" y="224">Create, view, update and delete patient records</text>
    <text x="66" y="250">Search by patient number or last name</text>
    <text x="66" y="276">Sort by last name, filter by blood group</text>
    <text x="66" y="302">Save and load records from a local text file</text>
  </g>

  <!-- call to action -->
  <rect x="40" y="322" width="214" height="40" rx="10" fill="url(#btn)" stroke="#28aaff" stroke-width="1.2"/>
  <text x="62" y="347" class="sans" font-size="14" font-weight="700" fill="#ffffff">View repository</text>
  <path d="M228 342 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- menu preview -->
  <rect x="580" y="40" width="340" height="322" rx="12" fill="#0a0f1a" stroke="#2f6fd0" stroke-width="1.5"/>
  <path d="M580 52 a12 12 0 0 1 12 -12 H908 a12 12 0 0 1 12 12 V76 H580 Z" fill="#101b30"/>
  <circle cx="602" cy="58" r="5.5" fill="#ff5f56"/><circle cx="622" cy="58" r="5.5" fill="#ffbd2e"/><circle cx="642" cy="58" r="5.5" fill="#27c93f"/>
  <text x="750" y="63" text-anchor="middle" class="mono" font-size="13" fill="#7f93b3">patient-management</text>

  <g class="mono" font-size="15">
    <text x="602" y="106"><tspan fill="#39A7FF" font-weight="700">$</tspan><tspan fill="#EAF2FF"> ./patient_mgmt</tspan></text>
    <text x="602" y="138" fill="#EAF2FF" font-weight="700">== PATIENT RECORDS ==</text>
    <g fill="#C9D6E8">
      <text x="602" y="168"><tspan fill="#39A7FF">1.</tspan> Add a patient</text>
      <text x="602" y="192"><tspan fill="#39A7FF">2.</tspan> View all records</text>
      <text x="602" y="216"><tspan fill="#39A7FF">3.</tspan> Update a record</text>
      <text x="602" y="240"><tspan fill="#39A7FF">4.</tspan> Delete a record</text>
      <text x="602" y="264"><tspan fill="#39A7FF">5.</tspan> Search</text>
      <text x="602" y="288"><tspan fill="#39A7FF">6.</tspan> Sort / Filter</text>
      <text x="602" y="312"><tspan fill="#39A7FF">0.</tspan> Exit</text>
    </g>
    <text x="602" y="342" fill="#39A7FF" font-weight="700">&gt;</text>
    <rect class="blink" x="620" y="329" width="9" height="17" fill="#39A7FF"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
