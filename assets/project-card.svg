<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Patient Management System</title>
  <desc id="d">Featured project: a menu-driven C application for managing patient records with add, delete, modify, search, sort, display by blood group, save and load. View repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C2B"/>
      <stop offset="1" stop-color="#0b1320"/>
    </linearGradient>
    <radialGradient id="glow" cx="750" cy="220" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39A7FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#39A7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#168fe8"/>
      <stop offset="1" stop-color="#0755b8"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    /* runs once, then holds the final state. Without animation support the final state is shown. */
    .pop    { animation: pop .01s linear both; }
    .cover  { transform: translateX(126px); animation: type 1.1s steps(14,end) .8s both; }
    .cur    { animation: move 4s both, cshow 4s both; }
    .blink  { animation: blink 1s steps(1) infinite; }

    @keyframes pop   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes type  { from { transform: translateX(0); } to { transform: translateX(126px); } }
    @keyframes move  {
      0%,20%      { transform: translate(0,-290px); animation-timing-function: steps(14,end); }
      47.5%,54.99% { transform: translate(126px,-290px); }
      55%,100%    { transform: translate(0,0); }
    }
    @keyframes cshow { 0%,10% { opacity: 0; } 10.01%,54.99% { opacity: 1; } 55%,92.49% { opacity: 0; } 92.5%,100% { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .cover { display: none; }
    }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="958" height="446" rx="18" fill="url(#bg)" stroke="#24547d" stroke-width="1.5"/>
  <rect x="1" y="1" width="958" height="446" rx="18" fill="url(#glow)"/>

  <!-- label -->
  <rect x="40" y="49" width="4" height="15" rx="2" fill="#39A7FF"/>
  <text x="54" y="62" class="sans" font-size="12" font-weight="700" letter-spacing="2.4" fill="#39A7FF">FEATURED PROJECT</text>

  <!-- title + description -->
  <text x="40" y="108" class="sans" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#EAF2FF">Patient Management System</text>
  <text x="40" y="138" class="sans" font-size="16" fill="#91A4BD">A menu-driven C application for managing patient records.</text>

  <!-- tech tags -->
  <g class="sans" font-size="12" font-weight="600" fill="#C9D6E8" text-anchor="middle">
    <rect x="40"  y="156" width="34"  height="26" rx="13" fill="#0d1624" stroke="#659AD2" stroke-opacity="0.7"/>
    <text x="57"  y="173">C</text>
    <rect x="82"  y="156" width="166" height="26" rx="13" fill="#0d1624" stroke="#26364B"/>
    <text x="165" y="173">Structured programming</text>
    <rect x="256" y="156" width="108" height="26" rx="13" fill="#0d1624" stroke="#26364B"/>
    <text x="310" y="173">File handling</text>
  </g>

  <!-- features -->
  <g fill="#0f2a4a" stroke="#39A7FF" stroke-width="1.2">
    <circle cx="48" cy="227" r="8"/><circle cx="48" cy="258" r="8"/><circle cx="48" cy="289" r="8"/><circle cx="48" cy="320" r="8"/>
  </g>
  <g fill="none" stroke="#39A7FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44.5 227 l2.5 2.5 l4.5 -5"/><path d="M44.5 258 l2.5 2.5 l4.5 -5"/>
    <path d="M44.5 289 l2.5 2.5 l4.5 -5"/><path d="M44.5 320 l2.5 2.5 l4.5 -5"/>
  </g>
  <g class="sans" font-size="16" fill="#C9D6E8">
    <text x="66" y="232">Add, delete and modify patient details</text>
    <text x="66" y="263">Search by patient number or last name</text>
    <text x="66" y="294">Sort by last name, display by blood group</text>
    <text x="66" y="325">Save and load records from a local text file</text>
  </g>

  <!-- call to action -->
  <rect x="40" y="368" width="214" height="40" rx="10" fill="url(#btn)" stroke="#28aaff" stroke-width="1.2"/>
  <text x="62" y="393" class="sans" font-size="14" font-weight="700" fill="#ffffff">View repository</text>
  <path d="M228 388 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- terminal -->
  <rect x="580" y="40" width="340" height="368" rx="12" fill="#0a0f1a" stroke="#2f6fd0" stroke-width="1.5"/>
  <path d="M580 52 a12 12 0 0 1 12 -12 H908 a12 12 0 0 1 12 12 V76 H580 Z" fill="#101b30"/>
  <circle cx="602" cy="58" r="5.5" fill="#ff5f56"/><circle cx="622" cy="58" r="5.5" fill="#ffbd2e"/><circle cx="642" cy="58" r="5.5" fill="#27c93f"/>
  <text x="750" y="63" text-anchor="middle" class="mono" font-size="13" fill="#7f93b3">patient-management</text>

  <g class="mono">
    <!-- typed command -->
    <g font-size="15">
      <text class="pop" style="animation-delay:.4s" x="602" y="102" textLength="9" fill="#39A7FF" font-weight="700">$</text>
      <text x="620" y="102" textLength="126" fill="#EAF2FF">./patient_mgmt</text>
      <rect class="cover" x="620" y="87" width="126" height="20" fill="#0a0f1a"/>
      <text class="pop" style="animation-delay:2.2s" x="602" y="124" fill="#EAF2FF" font-weight="700">== PATIENT RECORDS ==</text>
    </g>
    <!-- menu printed by the program -->
    <g font-size="13">
    <g class="pop" style="animation-delay:2.39s"><text x="618" y="148" text-anchor="end" fill="#39A7FF">1.</text><text x="626" y="148" fill="#C9D6E8">Add a patient</text></g>
    <g class="pop" style="animation-delay:2.48s"><text x="618" y="165" text-anchor="end" fill="#39A7FF">2.</text><text x="626" y="165" fill="#C9D6E8">Search by patient number</text></g>
    <g class="pop" style="animation-delay:2.57s"><text x="618" y="182" text-anchor="end" fill="#39A7FF">3.</text><text x="626" y="182" fill="#C9D6E8">Search by last name</text></g>
    <g class="pop" style="animation-delay:2.66s"><text x="618" y="199" text-anchor="end" fill="#39A7FF">4.</text><text x="626" y="199" fill="#C9D6E8">Delete a patient</text></g>
    <g class="pop" style="animation-delay:2.75s"><text x="618" y="216" text-anchor="end" fill="#39A7FF">5.</text><text x="626" y="216" fill="#C9D6E8">Modify phone number</text></g>
    <g class="pop" style="animation-delay:2.84s"><text x="618" y="233" text-anchor="end" fill="#39A7FF">6.</text><text x="626" y="233" fill="#C9D6E8">Modify email address</text></g>
    <g class="pop" style="animation-delay:2.93s"><text x="618" y="250" text-anchor="end" fill="#39A7FF">7.</text><text x="626" y="250" fill="#C9D6E8">Modify residential address</text></g>
    <g class="pop" style="animation-delay:3.02s"><text x="618" y="267" text-anchor="end" fill="#39A7FF">8.</text><text x="626" y="267" fill="#C9D6E8">Sort by last name</text></g>
    <g class="pop" style="animation-delay:3.11s"><text x="618" y="284" text-anchor="end" fill="#39A7FF">9.</text><text x="626" y="284" fill="#C9D6E8">Display all patients</text></g>
    <g class="pop" style="animation-delay:3.2s"><text x="618" y="301" text-anchor="end" fill="#39A7FF">10.</text><text x="626" y="301" fill="#C9D6E8">Save patient records</text></g>
    <g class="pop" style="animation-delay:3.29s"><text x="618" y="318" text-anchor="end" fill="#39A7FF">11.</text><text x="626" y="318" fill="#C9D6E8">Load patient records</text></g>
    <g class="pop" style="animation-delay:3.38s"><text x="618" y="335" text-anchor="end" fill="#39A7FF">12.</text><text x="626" y="335" fill="#C9D6E8">Display by blood group</text></g>
    <g class="pop" style="animation-delay:3.47s"><text x="618" y="352" text-anchor="end" fill="#39A7FF">13.</text><text x="626" y="352" fill="#C9D6E8">Count patients</text></g>
    <g class="pop" style="animation-delay:3.56s"><text x="618" y="369" text-anchor="end" fill="#39A7FF">14.</text><text x="626" y="369" fill="#C9D6E8">Exit</text></g>
    </g>
    <!-- input prompt -->
    <text class="pop" style="animation-delay:3.7s" x="602" y="392" font-size="15" fill="#39A7FF" font-weight="700">&gt;</text>
    <g class="cur"><rect class="blink" x="620" y="379" width="9" height="17" fill="#39A7FF"/></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
