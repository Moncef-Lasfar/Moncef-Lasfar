<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Moncef Lasfar, Cybersecurity Student" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Moncef Lasfar, Cybersecurity Student</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#17315c" opacity="0.65"/>
    </pattern>
    <radialGradient id="glow" cx="950" cy="180" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#367bf0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#367bf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#367bf0"/>
      <stop offset="1" stop-color="#367bf0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="360" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    /* typing timeline: one 12s loop */
    .g1 { animation: r1 12s infinite; }
    .o1 { animation: r2 12s infinite; }
    .g2 { animation: r3 12s infinite; }
    .o2 { animation: r4 12s infinite; }
    .g3 { animation: r5 12s infinite; }
    .c1 { animation: t1 12s infinite; }
    .c2 { animation: t2 12s infinite; }
    .cur { animation: move 12s infinite, show 12s infinite; }
    .blink { animation: blink 1s steps(1) infinite; }

    @keyframes r1 { 0%,2.5%{opacity:0} 2.51%,99.9%{opacity:1} 100%{opacity:0} }
    @keyframes r2 { 0%,15.83%{opacity:0} 15.84%,99.9%{opacity:1} 100%{opacity:0} }
    @keyframes r3 { 0%,17.5%{opacity:0} 17.51%,99.9%{opacity:1} 100%{opacity:0} }
    @keyframes r4 { 0%,32.5%{opacity:0} 32.51%,99.9%{opacity:1} 100%{opacity:0} }
    @keyframes r5 { 0%,34.16%{opacity:0} 34.17%,99.9%{opacity:1} 100%{opacity:0} }

    @keyframes t1 { 0%,8.33%{transform:translateX(0);animation-timing-function:steps(6,end)} 14.17%,100%{transform:translateX(57.6px)} }
    @keyframes t2 { 0%,22.5%{transform:translateX(0);animation-timing-function:steps(13,end)} 30.83%,100%{transform:translateX(124.8px)} }

    @keyframes move {
      0%,8.33%   { transform:translate(0,0); animation-timing-function:steps(6,end); }
      14.17%,17.5% { transform:translate(57.6px,0); }
      17.51%,22.5% { transform:translate(0,78px); animation-timing-function:steps(13,end); }
      30.83%,34.16% { transform:translate(124.8px,78px); }
      34.17%,100% { transform:translate(0,156px); }
    }
    @keyframes show { 0%,2.5%{opacity:0} 2.51%,99.9%{opacity:1} 100%{opacity:0} }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .cover { display: none; }
      .cur { transform: translate(0,156px); }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="#070a12"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- identity -->
    <text x="62" y="160" class="sans" font-size="74" font-weight="800" fill="#e6edf6" letter-spacing="-2">Moncef Lasfar</text>
    <rect x="66" y="180" width="260" height="3" rx="1.5" fill="url(#bar)"/>
    <text x="66" y="224" class="sans" font-size="30" font-weight="600" fill="#5b9bff">Cybersecurity & IT Infrastructure</text>

    <!-- Kali terminal -->
    <rect x="690" y="58" width="520" height="258" rx="12" fill="#367bf0" opacity="0.28" filter="url(#blur)"/>
    <rect x="680" y="44" width="540" height="272" rx="12" fill="#0a0f1a" stroke="#2f6fd0" stroke-width="1.5"/>
    <path d="M680 56 a12 12 0 0 1 12 -12 H1208 a12 12 0 0 1 12 12 V80 H680 Z" fill="#101b30"/>
    <circle cx="704" cy="62" r="5.5" fill="#ff5f56"/><circle cx="724" cy="62" r="5.5" fill="#ffbd2e"/><circle cx="744" cy="62" r="5.5" fill="#27c93f"/>
    <text x="950" y="67" text-anchor="middle" class="mono" font-size="13" fill="#7f93b3">moncef@kali: ~</text>

    <g class="mono" font-size="16">
      <!-- command 1: whoami -->
      <g class="g1">
        <text x="706" y="108"><tspan fill="#5b9bff">┌──(</tspan><tspan fill="#5b9bff" font-weight="700">moncef㉿kali</tspan><tspan fill="#5b9bff">)-[</tspan><tspan fill="#e6edf6" font-weight="700">~</tspan><tspan fill="#5b9bff">]</tspan></text>
        <text x="706" y="132" textLength="28.8"><tspan fill="#5b9bff">└─</tspan><tspan fill="#5b9bff" font-weight="700">$</tspan></text>
        <text x="744.4" y="132" textLength="57.6" fill="#e6edf6">whoami</text>
        <rect class="cover c1" x="744.4" y="116" width="57.6" height="22" fill="#0a0f1a"/>
      </g>
      <g class="o1">
        <text x="706" y="156" textLength="57.6" fill="#e6edf6">moncef</text>
      </g>
 
      <!-- command 2: ls skills/ -->
      <g class="g2">
        <text x="706" y="186"><tspan fill="#5b9bff">┌──(</tspan><tspan fill="#5b9bff" font-weight="700">moncef㉿kali</tspan><tspan fill="#5b9bff">)-[</tspan><tspan fill="#e6edf6" font-weight="700">~</tspan><tspan fill="#5b9bff">]</tspan></text>
        <text x="706" y="210" textLength="28.8"><tspan fill="#5b9bff">└─</tspan><tspan fill="#5b9bff" font-weight="700">$</tspan></text>
        <text x="744.4" y="210" textLength="124.8" fill="#e6edf6">cat track.txt</text>
        <rect class="cover c2" x="744.4" y="194" width="124.8" height="22" fill="#0a0f1a"/>
      </g>
      <g class="o2">
        <text x="706" y="234" textLength="307.2" fill="#e6edf6">cybersecurity, systems, networks</text>
      </g>

      <!-- idle prompt -->
      <g class="g3">
        <text x="706" y="264"><tspan fill="#5b9bff">┌──(</tspan><tspan fill="#5b9bff" font-weight="700">moncef㉿kali</tspan><tspan fill="#5b9bff">)-[</tspan><tspan fill="#e6edf6" font-weight="700">~</tspan><tspan fill="#5b9bff">]</tspan></text>
        <text x="706" y="288" textLength="28.8"><tspan fill="#5b9bff">└─</tspan><tspan fill="#5b9bff" font-weight="700">$</tspan></text>
      </g>

      <!-- cursor follows the typing -->
      <g class="cur">
        <rect class="blink" x="744.4" y="117" width="9.6" height="18" fill="#5b9bff"/>
      </g>
    </g>

    <!-- corner brackets -->
    <g fill="none" stroke="#367bf0" stroke-width="2.5" stroke-linecap="round">
      <path d="M22 46 V30 a8 8 0 0 1 8 -8 H46"/>
      <path d="M1234 22 H1250 a8 8 0 0 1 8 8 V46"/>
      <path d="M22 314 V330 a8 8 0 0 0 8 8 H46"/>
      <path d="M1258 314 V330 a8 8 0 0 1 -8 8 H1234"/>
    </g>
  </g>

  <rect x="1" y="1" width="1278" height="358" rx="17" fill="none" stroke="#12305a" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
